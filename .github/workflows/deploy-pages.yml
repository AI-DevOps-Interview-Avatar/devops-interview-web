name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocks the deploy on any high or critical advisory that is not written
      # down in scripts/auditGate.mjs with a reason and a review date. Plain
      # `npm audit --audit-level=high` cannot sit here: the one advisory we
      # carry has no fixed release to move to, so it would fail every build.
      - run: npm run audit:ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Vite's own chunk-size warning is only a line in this log, and the app
      # sat past it for weeks. This one fails the build — see docs/bundle-budget.md.
      - run: npm run bundle:budget
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
