name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # The same checks a pull request runs, from the same file — see
    # .github/workflows/checks.yml. Here they also package dist/ for Pages.
    uses: ./.github/workflows/checks.yml
    with:
      upload-pages-artifact: true
    # A called workflow does not inherit the block above it, so this repeats the
    # set the build job already had. Narrowing it is a separate change with its
    # own way of going wrong, and this one is about where the checks run.
    permissions:
      contents: read
      pages: write
      id-token: write

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
